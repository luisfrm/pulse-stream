name: Tests

# CI de PR vs. CD de master:
# - CI (este workflow, en cada `pull_request`): todo lo barato y sin base de
#   datos — typecheck/lint/unitarios del worker y del web + `generated.ts`
#   pinneado. Corre en PRs de cualquiera, sin secrets.
# - CD (`ci.yml`, solo master): integración con Neon (costosa), migraciones
#   Drizzle y luego `deploy-api-worker.yml`.
# El `name` del job ("PR checks") se usa como required check en branch
# protection: no cambiarlo sin actualizar esa regla.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc` no lo corre ninguna suite de tests: un fixture incompleto
      # (p. ej. `PlaylistRow` sin `artistId`) pasaba los unitarios y rompía
      # master. `pnpm typecheck` de la raíz no incluye el worker.
      - name: Worker typecheck
        run: pnpm --filter @pulse-stream/api-worker typecheck

      # `vitest run src` excluye `tests/**` (integración con DB): no necesita
      # TEST_DATABASE_URL ni dispara el guard de CI.
      - name: Worker unit tests
        run: pnpm --filter @pulse-stream/api-worker test:unit

      - name: Web typecheck
        run: pnpm --filter @pulse-stream/web typecheck

      - name: Web lint
        run: pnpm --filter @pulse-stream/web lint

      - name: Web unit tests
        run: pnpm --filter @pulse-stream/web test

      # El OpenAPI se exporta sin server (`createApp()`) y de ahí se regeneran
      # los tipos. Si alguien cambió rutas/contratos y no commiteó el
      # `generated.ts`, el `git diff` falla (misma regla que en master).
      - name: Generated types are pinned
        run: |
          pnpm --filter @pulse-stream/api-worker export:openapi
          pnpm gen:types:worker
          git diff --exit-code packages/api-types/src/generated.ts
