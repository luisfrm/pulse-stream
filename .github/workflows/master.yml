name: Master CI + Deploy

# Circuito completo (CD = master, gated):
#
#   PR → PR checks (`tests.yml`, sin DB)
#    ↓ merge
#   master → changes → web + api-worker (integración con Neon)
#               ↓ needs verde + paths del worker
#            deploy (migraciones prod → wrangler → smoke)
#
# Un solo workflow reemplaza a los dos que corrían en paralelo (`ci.yml` +
# `deploy-api-worker.yml`): el `needs` del job `deploy` hace imposible publicar
# con la integración roja. La selectividad por paths ya no vive en el `on:` (los
# pushes a master siempre verifican); solo decide si se deploya.
#
# Requiere el environment `production` con los secrets:
#   CLOUDFLARE_API_TOKEN, MIGRATE_DATABASE_URL, DATABASE_URL, AUTH_SECRET,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, RESEND_API_KEY
# y la variable CLOUDFLARE_ACCOUNT_ID (environment o repositorio).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy aunque no haya cambios del worker"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: master-pipeline
  cancel-in-progress: false

jobs:
  changes:
    name: Detect worker changes
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      # fetch-depth: 0 — con el shallow clone por defecto, un `workflow_dispatch`
      # diffea el commit boundary (todos los archivos como "A") y `worker`
      # quedaría en `true` siempre: cualquier dispatch manual deployaría y
      # `force_deploy` sería decorativo. Con historia completa, el dispatch
      # diffea el último commit real.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            worker:
              - 'apps/api-worker/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/master.yml'

  web:
    name: Web (pnpm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @pulse-stream/web typecheck

      - name: Lint
        run: pnpm --filter @pulse-stream/web lint

      # `NEXT_PUBLIC_API_URL` se inlinea en build: sin ella el bundle apunta al
      # propio origen del web y el build "pasa" en falso. Es un valor público.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://pulse-stream-api.luisrivas.site
        run: pnpm --filter @pulse-stream/web build

  api-worker:
    name: API Worker (typecheck + vitest + dry-run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync apps/api (bootstrap de test del worker)
        working-directory: apps/api
        run: uv sync --all-groups

      # Infraestructura de test del Worker (no CI de Python): el esquema base de
      # la base de test sale de Alembic y encima corren las migraciones Drizzle
      # del Worker. Cuando exista el baseline Drizzle `0000` (esquema completo),
      # este paso y `apps/api` dejan de ser necesarios.
      - name: Python schema (Alembic, bootstrap de test)
        working-directory: apps/api
        env:
          RAW_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          # `Settings` exige AUTH_SECRET al importar (aunque Alembic no lo use).
          AUTH_SECRET: ci-not-a-secret
        run: |
          export DATABASE_URL_DIRECT="$(printf '%s' "$RAW_DATABASE_URL" | sed -E 's#^postgresql(\+asyncpg)?://#postgresql+asyncpg://#')"
          export DATABASE_URL="$DATABASE_URL_DIRECT"
          uv run alembic upgrade head

      - name: Worker migrations (Drizzle)
        env:
          RAW_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          CONFIRM_TARGET: "yes"
        run: |
          export MIGRATE_DATABASE_URL="$(printf '%s' "$RAW_DATABASE_URL" | sed -E 's#^postgresql\+asyncpg://#postgresql://#')"
          export TEST_DATABASE_URL_WORKER="$MIGRATE_DATABASE_URL"
          pnpm --filter @pulse-stream/api-worker db:migrate

      - name: Typecheck
        run: pnpm --filter @pulse-stream/api-worker typecheck

      # Las suites de integración (F3..F7) corren contra la base del worker; el
      # guard `tests/ci-guard.test.ts` falla si CI=true y falta la variable.
      - name: Test
        env:
          TEST_DATABASE_URL_WORKER: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          CI: "true"
        run: pnpm --filter @pulse-stream/api-worker test

      - name: Build (wrangler deploy --dry-run)
        run: pnpm --filter @pulse-stream/api-worker build

      # `generated.ts` está pinneado: el Worker debe generar exactamente el
      # archivo commiteado (sin server corriendo, vía export:openapi).
      - name: Generated types are pinned
        run: |
          pnpm gen:types:worker
          git diff --exit-code packages/api-types/src/generated.ts

  deploy:
    name: Deploy to Cloudflare Workers
    # Gating real: si la integración o el web fallan, no se publica nada.
    needs: [changes, web, api-worker]
    # Sin cambios del worker el deploy se salta; `force_deploy` lo fuerza a mano.
    if: needs.changes.outputs.worker == 'true' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sin `environment` los secrets de environment no existen para el job.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck y unit tests NO se repiten acá: ya corrieron en `api-worker`
      # (needs) y `wrangler deploy` bundlea con esbuild sin chequear tipos.

      # Migraciones con el endpoint DIRECTO de Neon (el pooled es solo para el
      # runtime). `CONFIRM_TARGET=yes` es obligatorio fuera de la base de test.
      - name: Migraciones (Neon directa)
        working-directory: apps/api-worker
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          CONFIRM_TARGET: "yes"
        run: pnpm db:migrate

      # Con `ENV=prod` el worker hace fail-fast si falta configuración y
      # responde 500 en todos los endpoints. Mejor no publicar que dejar el
      # sitio caído por un secret olvidado.
      - name: Preflight secrets
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for v in AUTH_SECRET DATABASE_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY RESEND_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v"; exit 1; }
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api-worker
          command: deploy

      # GitHub es la fuente de verdad de los secrets de runtime: se pisan en
      # cada deploy (idempotente) y así rotar es cambiar el secret + push.
      # `jq` arma el JSON para no romper con comillas/backslashes en la URL.
      - name: Sync Worker secrets
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for v in AUTH_SECRET DATABASE_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY RESEND_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v"; exit 1; }
          done
          jq -n --arg a "$AUTH_SECRET" --arg d "$DATABASE_URL" \
                --arg i "$R2_ACCESS_KEY_ID" --arg s "$R2_SECRET_ACCESS_KEY" \
                --arg r "$RESEND_API_KEY" \
                '{AUTH_SECRET:$a, DATABASE_URL:$d, R2_ACCESS_KEY_ID:$i, R2_SECRET_ACCESS_KEY:$s, RESEND_API_KEY:$r}' > secrets.json
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      # `/health` valida el fail-fast de config (ENV=prod exige todos los
      # secretos) y `/artists` valida la conexión a Neon. En el primer deploy el
      # certificado del custom domain puede tardar: se reintenta ~2 min.
      - name: Smoke
        run: |
          for url in \
            "https://pulse-stream-api.luisrivas.site/health" \
            "https://pulse-stream-api.luisrivas.site/genres" \
            "https://pulse-stream-api.luisrivas.site/artists?limit=1"; do
            curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --retry-max-time 150 "$url" > /dev/null
          done
          echo "Smoke OK"
