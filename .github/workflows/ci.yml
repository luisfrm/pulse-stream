name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API Python (uv + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          # Opcional: una branch efímera de Neon (plan sección 7). Sin ella, los
          # tests de integración se saltan con un mensaje claro.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: uv run pytest

  app-api:
    name: App API (Hono + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @pulse-stream/app-api typecheck

      - name: Tests
        run: pnpm --filter @pulse-stream/app-api test

      - name: Validate Wrangler config
        run: pnpm --filter @pulse-stream/app-api exec wrangler deploy --dry-run --env prod --outdir dist

  web:
    name: Web + Panel (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter @pulse-stream/web typecheck

      - name: Lint (web)
        run: pnpm --filter @pulse-stream/web lint

      - name: Build (web)
        run: pnpm --filter @pulse-stream/web build

      - name: Typecheck (panel)
        run: pnpm --filter @pulse-stream/panel typecheck

      - name: Lint (panel)
        run: pnpm --filter @pulse-stream/panel lint

      - name: Build (panel)
        run: pnpm --filter @pulse-stream/panel build

      - name: Tests (frontend)
        run: |
          pnpm --filter @pulse-stream/shared test
          pnpm --filter @pulse-stream/api-client test
          pnpm --filter @pulse-stream/web test
          pnpm --filter @pulse-stream/panel test

  deploy:
    name: Deploy API (prod)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [api, app-api, web]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --all-groups

      - name: Check production vars
        run: |
          if grep -q "REPLACE_WITH_R2_PUBLIC_BASE_URL" apps/app-api/wrangler.jsonc; then
            echo "::error::Set R2_PUBLIC_BASE_URL in apps/app-api/wrangler.jsonc before deploying."
            exit 1
          fi

      - name: Migrate Neon main
        working-directory: apps/api
        env:
          # La conexión directa (sin -pooler) sirve para Alembic y para el
          # driver HTTP del Worker.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: uv run alembic upgrade head

      - name: Deploy Worker
        working-directory: apps/app-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env prod

      - name: Sync Worker secrets
        working-directory: apps/app-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for name in DATABASE_URL AUTH_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            value=$(printenv "$name")
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env prod
          done
