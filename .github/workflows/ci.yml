name: CI (integración)

# Los tests unitarios corren en cada PR (`tests.yml`). Este workflow usa bases
# de datos reales (Neon) y corre solo sobre master (o a mano con workflow_dispatch)
# para no consumir la DB de test en cada PR.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  api:
    name: API (uv + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # `Settings` (pydantic) exige estos dos al importar; el `.env` local está
      # git-ignored y en CI no existe. Los tests usan TEST_DATABASE_URL.
      AUTH_SECRET: ci-not-a-secret
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          # Base PROPIA del backend Python: su `drop_all` no convive con las
          # tablas del Worker (que usa TEST_DATABASE_URL_WORKER).
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: uv run pytest

  web:
    name: Web (pnpm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @pulse-stream/web typecheck

      - name: Lint
        run: pnpm --filter @pulse-stream/web lint

      # `NEXT_PUBLIC_API_URL` se inlinea en build: sin ella el bundle apunta al
      # propio origen del web y el build "pasa" en falso. Es un valor público.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://pulse-stream-api.luisrivas.site
        run: pnpm --filter @pulse-stream/web build

  api-worker:
    name: API Worker (typecheck + vitest + dry-run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Python dependencies (schema de referencia)
        working-directory: apps/api
        run: uv sync --all-groups

      # El esquema base lo define el backend Python (Alembic); el Worker suma
      # sus propias migraciones Drizzle (better-auth) encima.
      - name: Python schema (Alembic, base de referencia)
        working-directory: apps/api
        env:
          RAW_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          # `Settings` exige AUTH_SECRET al importar (aunque Alembic no lo use).
          AUTH_SECRET: ci-not-a-secret
        run: |
          export DATABASE_URL_DIRECT="$(printf '%s' "$RAW_DATABASE_URL" | sed -E 's#^postgresql(\+asyncpg)?://#postgresql+asyncpg://#')"
          export DATABASE_URL="$DATABASE_URL_DIRECT"
          uv run alembic upgrade head

      - name: Worker migrations (Drizzle)
        env:
          RAW_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          CONFIRM_TARGET: "yes"
        run: |
          export MIGRATE_DATABASE_URL="$(printf '%s' "$RAW_DATABASE_URL" | sed -E 's#^postgresql\+asyncpg://#postgresql://#')"
          export TEST_DATABASE_URL_WORKER="$MIGRATE_DATABASE_URL"
          pnpm --filter @pulse-stream/api-worker db:migrate

      - name: Typecheck
        run: pnpm --filter @pulse-stream/api-worker typecheck

      # Las suites de integración (F3..F7) corren contra la base del worker; el
      # guard `tests/ci-guard.test.ts` falla si CI=true y falta la variable.
      - name: Test
        env:
          TEST_DATABASE_URL_WORKER: ${{ secrets.TEST_DATABASE_URL_WORKER }}
          CI: "true"
        run: pnpm --filter @pulse-stream/api-worker test

      - name: Build (wrangler deploy --dry-run)
        run: pnpm --filter @pulse-stream/api-worker build

      # `generated.ts` está pinneado: el Worker debe generar exactamente el
      # archivo commiteado (sin server corriendo, vía export:openapi).
      - name: Generated types are pinned
        run: |
          pnpm gen:types:worker
          git diff --exit-code packages/api-types/src/generated.ts
