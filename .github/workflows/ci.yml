name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (uv + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          # Opcional: una branch efímera de Neon (plan sección 7). Sin ella,
          # los tests de integración se saltan con un mensaje claro.
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: uv run pytest

  web:
    name: Web (pnpm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm --filter @pulse-stream/web typecheck

      - name: Lint
        run: pnpm --filter @pulse-stream/web lint

      - name: Build
        run: pnpm --filter @pulse-stream/web build
