packages:
  - "apps/*"
  - "packages/*"

# Aprobaciones de build scripts (antes vivía en apps/web/pnpm-workspace.yaml).
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261021.1'
  - jose@6.2.13
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
